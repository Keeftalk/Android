name: Keeftalk Android Release Publisher

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force publication of pre-release regardless of thresholds'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-publisher-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Check Release Thresholds (5-Merge / 5-Day)
        id: check_release
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/release_helper.py check

      - name: Setup Signing Keystore
        if: steps.check_release.outputs.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/keystore.jks"
            echo "KEYSTORE_FILE_PATH=${{ runner.temp }}/keystore.jks" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. Release build will run without custom signing configuration."
          fi

      - name: Build Release APKs & Run Unit Tests
        if: steps.check_release.outputs.should_release == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:test :app:assembleRelease --stacktrace

      - name: Verify Release APKs & Signatures
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          echo "Verifying generated release APKs..."
          APK_DIR="app/build/outputs/apk/release"
          
          EXPECTED_APKS=(
            "app-arm64-v8a-release.apk"
            "app-armeabi-v7a-release.apk"
            "app-x86-release.apk"
            "app-x86_64-release.apk"
          )
          
          for apk in "${EXPECTED_APKS[@]}"; do
            FILE_PATH="$APK_DIR/$apk"
            if [ ! -f "$FILE_PATH" ]; then
              echo "::error::Missing expected release APK: $FILE_PATH"
              exit 1
            fi
            
            FILE_SIZE=$(stat -c%s "$FILE_PATH" 2>/dev/null || stat -f%z "$FILE_PATH")
            if [ "$FILE_SIZE" -le 0 ]; then
              echo "::error::Release APK $FILE_PATH is empty (size 0)"
              exit 1
            fi
            echo "✓ Found $apk (size: $FILE_SIZE bytes)"
          done

          APKSIGNER_BIN=$(find $ANDROID_HOME/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            for apk in "${EXPECTED_APKS[@]}"; do
              echo "Verifying signature for $apk..."
              "$APKSIGNER_BIN" verify --verbose "$APK_DIR/$apk" || echo "::warning::Signature verification warning for $apk"
            done
          fi

      - name: Generate Release Notes
        if: steps.check_release.outputs.should_release == 'true'
        run: python3 .github/scripts/release_helper.py notes

      - name: Create GitHub Pre-Release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_release.outputs.next_tag }}
        run: |
          echo "Publishing Pre-Release $TAG to GitHub..."
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --title "Keeftalk $TAG" \
            --notes-file release_notes.md \
            --prerelease \
            --target main

      - name: Cleanup Signing Files
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/keystore.jks" ]; then
            echo "Cleaning up temporary keystore file..."
            rm -f "${{ runner.temp }}/keystore.jks"
          fi
