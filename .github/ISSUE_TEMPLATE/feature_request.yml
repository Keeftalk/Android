name: Feature Request
description: Suggest an idea or feature enhancement for Keeftalk
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Keeftalk better! Tell us about the feature you'd like to see.
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented in Keeftalk.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, UI mockups, or architectural ideas here.
